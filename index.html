    <script>
      (function () {
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch : null;
          var _activeFetch = _origFetch;
          function safeFetch() {
            if (_activeFetch) {
              return _activeFetch.apply(this, arguments);
            }
            if (_origFetch) {
              return _origFetch.apply(this, arguments);
            }
            return Promise.reject(new Error('Fetch unavailable'));
          }

          try {
            Object.defineProperty(window, 'fetch', {
              get: function () {
                return _activeFetch || safeFetch;
              },
              set: function (newFn) {
                _activeFetch = newFn;
              },
              configurable: true,
              enumerable: true,
            });
          } catch (e1) {
            try {
              if (window.Window && window.Window.prototype) {
                Object.defineProperty(window.Window.prototype, 'fetch', {
                  get: function () {
                    return _activeFetch || safeFetch;
                  },
                  set: function (newFn) {
                    _activeFetch = newFn;
                  },
                  configurable: true,
                  enumerable: true,
                });
              }
            } catch (e2) {}
          }
        } catch (err) {}
      })();
    </script>
